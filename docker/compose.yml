name: Zin

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    container_name: ZinPostgres
    environment:
      POSTGRES_DB: zin
      POSTGRES_USER: zin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - ./postgresql:/var/lib/postgresql